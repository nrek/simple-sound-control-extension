<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="purple">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Simple Sound Control</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="surface" role="application" aria-label="Simple Sound Control">
      <div id="screen-main" class="screen">
        <header class="top-bar">
          <div class="brand">
            <img
              class="brand-icon"
              src="icon-48.png"
              width="48"
              height="48"
              alt=""
              aria-hidden="true"
              decoding="async"
            />
            <h1 class="title">Simple Sound Control</h1>
          </div>
          <button
            type="button"
            id="settings-open"
            class="icon-btn"
            aria-expanded="false"
            aria-controls="screen-settings"
            title="Settings"
          >
            <span class="visually-hidden">Settings</span>
            <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                d="M19.14 12.94a7.49 7.49 0 0 0 .05-.94 7.49 7.49 0 0 0-.05-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54A.5.5 0 0 0 13.9 2h-3.84a.5.5 0 0 0-.5.42l-.36 2.54a7.03 7.03 0 0 0-1.62.94l-2.39-.96a.5.5 0 0 0-.61.22L2.66 8.48a.5.5 0 0 0 .12.64l2.03 1.58a7.49 7.49 0 0 0-.05.94c0 .32.02.63.05.94L2.78 14.16a.5.5 0 0 0-.12.64l1.92 3.32a.5.5 0 0 0 .61.22l2.39-.96c.5.39 1.05.71 1.62.94l.36 2.54a.5.5 0 0 0 .5.42h3.84a.5.5 0 0 0 .5-.42l.36-2.54c.57-.23 1.12-.55 1.62-.94l2.39.96a.5.5 0 0 0 .61-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.04-1.58zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"
              />
            </svg>
          </button>
        </header>

        <section class="section volume-section" aria-labelledby="volume-label">
          <div class="volume-row">
            <label id="volume-label" class="label" for="volume-slider">Volume</label>
            <output class="volume-value" id="volume-value" for="volume-slider">100%</output>
          </div>
          <div class="slider-wrap">
            <span class="slider-min" aria-hidden="true">0%</span>
            <input
              type="range"
              id="volume-slider"
              class="md-slider"
              min="0"
              max="400"
              value="100"
              step="1"
              aria-valuemin="0"
              aria-valuemax="400"
              aria-valuenow="100"
              aria-valuetext="100 percent"
            />
            <span class="slider-max" aria-hidden="true">400%</span>
          </div>
          <label class="checkbox-row pin-domain-row" for="pin-domain-toggle">
            <span class="checkbox-label" id="pin-domain-label">Pin Settings: this domain</span>
            <input type="checkbox" id="pin-domain-toggle" class="md-checkbox" />
          </label>
        </section>

        <section class="section" aria-labelledby="quick-label">
          <h2 id="quick-label" class="section-title">Quick actions</h2>
          <div class="chip-row" role="group" aria-label="Preset volume levels">
            <button type="button" class="chip chip-tonal" data-volume="0" data-preset="0" title="Mute (0%)">
              Mute
            </button>
            <button type="button" class="chip chip-tonal" data-volume="20" data-preset="20">20%</button>
            <button type="button" class="chip chip-tonal" data-volume="50" data-preset="50">50%</button>
            <button type="button" class="chip chip-tonal" data-volume="100" data-preset="100">100%</button>
          </div>
        </section>

        <footer class="footer">
          <a
            class="coffee-link"
            href="https://paypal.me/nrek"
            target="_blank"
            rel="noopener noreferrer"
          >
            Buy me a coffee
          </a>
        </footer>
      </div>

      <div id="screen-settings" class="screen screen--stack" hidden>
        <header class="settings-screen-header">
          <button type="button" id="settings-close" class="icon-btn icon-btn--leading" title="Back">
            <span class="visually-hidden">Back to main</span>
            <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
            </svg>
          </button>
          <h2 class="settings-screen-title">Settings</h2>
        </header>

        <section
          class="settings-block tab-capture-block"
          aria-labelledby="tab-capture-heading"
          id="tab-capture-section"
        >
          <h3 id="tab-capture-heading" class="settings-heading">Tab Capture mode</h3>
          <label class="switch-row" for="tab-capture-toggle">
            <span class="switch-row__main">
              <span class="switch-row__title">Route tab audio through SSC</span>
              <span class="switch-row__hint" id="tab-capture-hint">
                Captures the entire tab's audio and applies volume / boost in the extension.
                Required for Google Meet, Zoom Web, Discord, and other WebRTC apps.
                Chrome will ask once for permission to capture tab content.
              </span>
            </span>
            <span class="switch-control" aria-hidden="true">
              <input type="checkbox" id="tab-capture-toggle" class="switch-input" />
              <span class="switch-track"></span>
              <span class="switch-thumb"></span>
            </span>
          </label>
        </section>

        <section class="settings-block" aria-labelledby="theme-heading">
          <h3 id="theme-heading" class="settings-heading">Theme</h3>
          <div class="theme-toggle" role="group" aria-labelledby="theme-heading">
            <button
              type="button"
              class="theme-option is-active"
              id="theme-dark"
              data-theme="dark"
              aria-pressed="true"
            >
              Dark
            </button>
            <button type="button" class="theme-option" id="theme-light" data-theme="light" aria-pressed="false">
              Light
            </button>
          </div>
        </section>

        <section class="settings-block" aria-labelledby="accent-heading">
          <h3 id="accent-heading" class="settings-heading">Accent color</h3>
          <div class="accent-grid" role="listbox" aria-label="Accent color">
            <button type="button" class="accent-swatch" data-accent="purple" title="Purple" aria-selected="true">
              <span class="visually-hidden">Purple</span>
            </button>
            <button type="button" class="accent-swatch" data-accent="blue" title="Blue">
              <span class="visually-hidden">Blue</span>
            </button>
            <button type="button" class="accent-swatch" data-accent="orange" title="Orange">
              <span class="visually-hidden">Orange</span>
            </button>
            <button type="button" class="accent-swatch" data-accent="red" title="Red">
              <span class="visually-hidden">Red</span>
            </button>
            <button type="button" class="accent-swatch" data-accent="green" title="Green">
              <span class="visually-hidden">Green</span>
            </button>
            <button type="button" class="accent-swatch" data-accent="teal" title="Teal">
              <span class="visually-hidden">Teal</span>
            </button>
            <button type="button" class="accent-swatch" data-accent="seafoam" title="Seafoam">
              <span class="visually-hidden">Seafoam</span>
            </button>
            <button type="button" class="accent-swatch" data-accent="yellow" title="Yellow">
              <span class="visually-hidden">Yellow</span>
            </button>
            <button type="button" class="accent-swatch" data-accent="gray" title="Gray">
              <span class="visually-hidden">Gray</span>
            </button>
          </div>
        </section>

        <section class="settings-block" aria-labelledby="pinned-label">
          <div class="settings-heading-row">
            <h3 id="pinned-label" class="settings-heading">Pins</h3>
            <button
              type="button"
              id="pinned-filter-toggle"
              class="filter-icon-btn"
              aria-label="Toggle pin filter"
              aria-expanded="false"
              title="Filter pins"
            >
              <svg class="icon-svg fa-filter-icon" viewBox="0 0 512 512" aria-hidden="true" focusable="false">
                <path d="M3.9 54.9C10.5 40.9 24.5 32 40 32h432c15.5 0 29.5 8.9 36.1 22.9s4.6 30.5-5.2 42.5L320 320.9V448c0 12.1-6.8 23.2-17.7 28.6s-23.8 4.3-33.5-3l-64-48A32 32 0 0 1 192 400V320.9L9 97.3C-.7 85.4-2.8 68.8 3.9 54.9z" />
              </svg>
            </button>
          </div>
          <input
            type="search"
            id="pinned-filter"
            class="filter-input"
            placeholder="Search list..."
            aria-label="Filter pinned levels"
            hidden
          />
          <div id="panel-pinned-levels" class="saved-panel" role="region" aria-labelledby="pinned-label">
            <ul class="saved-list" id="pinned-list"></ul>
            <p class="saved-empty" id="pinned-empty" hidden>No pinned domain levels.</p>
            <div class="pagination-row" id="pinned-pagination" hidden>
              <button type="button" class="pagination-btn" id="pinned-prev">Prev</button>
              <span class="pagination-status" id="pinned-page-status">Page 1 of 1</span>
              <button type="button" class="pagination-btn" id="pinned-next">Next</button>
            </div>
          </div>
        </section>
      </div>
    </div>
    <script src="audio-policy.js"></script>
    <script src="pin-policy.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
